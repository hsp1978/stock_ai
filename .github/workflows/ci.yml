name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + dependency smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # 테스트는 외부 API 호출/모델 로드 없음. CI 환경에 안전한 기본값.
      TRADING_MODE: paper
      DEFAULT_LLM_PROVIDER: ollama
      OLLAMA_HOST: http://localhost:11434
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chart_agent_service/requirements.txt
            stock_analyzer/requirements.txt

      - name: Install dependencies (CPU-only TensorFlow)
        run: |
          python -m pip install --upgrade pip
          # CI 러너는 GPU 없음 — [and-cuda] extras 제거하여 ~5GB CUDA 휠 다운로드 회피
          sed 's/tensorflow\[and-cuda\]/tensorflow-cpu/' chart_agent_service/requirements.txt > /tmp/req-agent-ci.txt
          pip install -r /tmp/req-agent-ci.txt
          pip install -r stock_analyzer/requirements.txt
          # 테스트 전용 도구
          pip install pytest pytest-timeout pytest-cov respx

      - name: Dependency smoke import
        # requirements.txt 와 실제 import 간의 누락을 잡는다.
        # 과거 회귀: litellm / tenacity / circuitbreaker / pandas_market_calendars
        # 가 코드에서 import 되었으나 requirements 에 없어 런타임에서만 깨졌었음.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "chart_agent_service")
          sys.path.insert(0, "stock_analyzer")

          critical_modules = [
              # 최근 추가된 의존성
              "litellm",
              "tenacity",
              "circuitbreaker",
              "pandas_market_calendars",
              # 기존 핵심
              "fastapi",
              "pydantic",
              "pydantic_settings",
              "httpx",
              "pandas",
              "numpy",
              "yfinance",
              "pykrx",
              "FinanceDataReader",  # pip 패키지명은 finance-datareader, import 명은 다름
              # 프로젝트 내부 진입점
              "safety.kill_switch",
              "safety.models",
              "llm.router",
              "llm.circuit_breakers",
              "market_cal.market_calendar",
              "signal_agg",
              "data_collector",
          ]
          failures = []
          for m in critical_modules:
              try:
                  __import__(m)
              except Exception as exc:
                  failures.append(f"{m}: {type(exc).__name__}: {exc}")
          if failures:
              print("SMOKE IMPORT FAILURES:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"OK: {len(critical_modules)} modules importable")
          PY

      - name: Run unit tests
        run: |
          pytest tests/ --timeout=30 -v --tb=short

      - name: Report test summary
        if: always()
        run: |
          echo "::notice::CI finished — branch=${{ github.ref_name }} sha=${{ github.sha }}"
