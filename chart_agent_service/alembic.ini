# Alembic 설정 — 스키마 변경을 버전으로 관리한다 (CLAUDE.md Don't #8).
#
# DB 경로는 여기 적지 않는다. `migrations/env.py` 가 `config.OUTPUT_DIR` 에서
# 읽는다 — 설정을 두 곳에 두면 갈린다.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-7s [alembic] %(message)s
