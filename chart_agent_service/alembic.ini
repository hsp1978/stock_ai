# Alembic 설정 — 스키마 변경을 버전으로 관리한다 (CLAUDE.md Don't #8).
#
# DB 경로는 여기 적지 않는다. `migrations/env.py` 가 `config.OUTPUT_DIR` 에서
# 읽는다 — 설정을 두 곳에 두면 갈린다.
#
# **로깅 섹션([loggers]/[handlers]/[formatters])을 두지 않는다.** 두면 env.py 의
# `fileConfig()` 가 루트 로거를 교체해 서비스 로깅 설정(레벨·포맷·비밀값 마스킹
# 필터)을 덮는다 — 2026-09-15 에 실제로 그렇게 깨졌다. env.py 도 fileConfig 를
# 호출하지 않는다. Alembic 로그는 `alembic` 로거로 나가고 루트 설정을 상속한다.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
